name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установить зависимости
        run: uv sync

      - name: Линт
        run: uv run ruff check .

      - name: Форматирование
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy

      - name: Тесты
        run: uv run pytest
