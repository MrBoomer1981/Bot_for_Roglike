[project]
name = "balatro-bot"
version = "0.0.1"
description = "Бот-советник для Balatro: считает очки и ранжирует ходы"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
balatro-bot = "balatro_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balatro_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# Документация и тесты написаны по-русски, поэтому проверки на «подозрительные»
# кириллические символы в строках и комментариях только шумят.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Файл сгенерирован: описания эффектов переносить нельзя, это игровой текст.
"balatro_bot/core/catalogue.py" = ["E501"]

[tool.ruff.lint.pep8-naming]
# Имена тестов по-русски: `test_туз_старший` читается лучше транслита.
ignore-names = ["test_*", "Test*"]

[tool.mypy]
strict = true
files = ["balatro_bot", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
